<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Neon Reef — Pearl Pusher</title>
  </head>
  <body>
    <main id="app">
      <div id="viewport" aria-label="3D pusher cabinet. Move the pointer to aim; press to launch."></div>
      <header class="hud-top">
        <div class="stat"><span>Credits</span><strong id="credits">0</strong></div>
        <div class="stat"><span>Shots</span><strong id="shots">0</strong></div>
        <div class="stat"><span>Tickets</span><strong id="tickets">0</strong></div>
        <div class="stat jackpot"><span>Jackpot</span><strong id="jackpot">0</strong></div>
        <div class="stat party" id="party" role="status" hidden></div>
      </header>
      <ol id="feed" class="feed" aria-live="polite"></ol>
      <footer class="hud-bottom">
        <button id="credit" type="button">+5 CREDITS</button>
        <button id="launch" type="button" class="launch">LAUNCH <small>hold · Space</small></button>
        <button id="reset" type="button">RESET</button>
      </footer>
      <div id="loading" class="loading">Loading physics…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
