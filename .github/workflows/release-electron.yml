name: Release Electron (Windows)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and smoke desktop game
        run: npm run electron:smoke
      - name: Package Windows portable and installer
        run: npm run build:electron:win
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v7
        with:
          name: electron-windows-artifacts
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-screenshot
          path: dist_electron/electron-smoke*.png
          if-no-files-found: warn

  publish:
    needs: windows-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: electron-windows-artifacts
          path: release-assets
      - name: Publish downloadable Windows release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows desktop builds from commit `${{ github.sha }}`.
            Use the `portable.exe` download with LaunchBox; the `setup.exe` download installs the game.
          files: release-assets/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
